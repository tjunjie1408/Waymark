[[package]]
name = "waymark"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "awscrt" },
    { name = "boto3" },
    { name = "duckdb" },
    { name = "numpy" },
    { name = "pandas" },
    { name = "pyarrow" },
    { name = "pydantic" },
    { name = "pyyaml" },
]

[package.optional-dependencies]
remote-ml = [
    { name = "catboost" },
    { name = "lightgbm" },
    { name = "scikit-learn" },
    { name = "shap" },
]

[package.dev-dependencies]
dev = [
    { name = "hypothesis" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "awscrt", specifier = ">=0.38.1" },
    { name = "boto3", specifier = ">=1.35" },
    { name = "catboost", marker = "extra == 'remote-ml'", specifier = ">=1.2.7" },
    { name = "duckdb", specifier = ">=1.1" },
    { name = "lightgbm", marker = "extra == 'remote-ml'", specifier = ">=4.5" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "pandas", specifier = ">=2.2" },
    { name = "pyarrow", specifier = ">=17.0" },
    { name = "pydantic", specifier = ">=2.9" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "scikit-learn", marker = "extra == 'remote-ml'", specifier = ">=1.5" },
    { name = "shap", marker = "extra == 'remote-ml'", specifier = ">=0.46" },
]
provides-extras = ["remote-ml"]

[package.metadata.requires-dev]
dev = [
    { name = "hypothesis", specifier = ">=6.115" },
    { name = "pytest", specifier = ">=8.3" },
    { name = "ruff", specifier = ">=0.7" },
]
